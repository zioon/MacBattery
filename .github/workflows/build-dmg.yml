name: Build and release DMG

# Trigger on version tags (v*) and allow manual dispatch.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不含 v 前缀，例如 1.1.12）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 纯逻辑层单测（U-09）：发布前的回归护栏。构建与发版都依赖本 job 通过。
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard MacBatteryCore purity
        run: |
          if grep -rn "import AppKit\|import IOKit\|import SwiftUI" Sources/MacBatteryCore/; then
            echo "::error::MacBatteryCore 必须保持纯逻辑层（禁止 import AppKit / IOKit / SwiftUI）"
            exit 1
          fi
      - name: Guard against hardcoded UI strings
        run: python3 Scripts/check_hardcoded_strings.py
      - name: Guard localization keys
        run: python3 Scripts/check_localization_keys.py
      - name: swift test
        run: swift test
        timeout-minutes: 20

  build-and-release:
    needs: test
    # macOS-14 (arm64) hosted runner is free on public repos.
    # Build a universal binary (arm64 + x86_64) so it runs on both
    # Apple Silicon and Intel Macs.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 默认 fetch-depth:1 不拉 tag，会让下方 `git describe --tags` 的回退分支失效。
          fetch-depth: 0

      # 版本号单一来源：手动触发用输入值，tag push 用 tag 名，否则回退到最近的 tag。
      # 解析结果供后续的一致性校验与 Info.plist 写入使用。
      - name: Resolve release version
        id: version
        env:
          # 经环境变量中转，避免把用户输入直接插进 shell（命令注入面）。
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          elif [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          if [ -z "$VER" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release version: $VER"

      # 一致性校验：避免"改了代码版本号却忘了同步 / 忘了写 CHANGELOG"导致应用内自动更新错乱。
      - name: Check version consistency
        env:
          # 同样经环境变量中转，不在 shell 里展开 github 表达式。
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          VER="$RELEASE_VERSION"
          SRC="$(sed -n 's/.*static let fallback = "\([0-9A-Za-z.-]*\)".*/\1/p' Sources/MacBattery/Updater.swift | head -n1)"
          echo "AppVersion.fallback = $SRC ; release version = $VER"
          if [ "$SRC" != "$VER" ]; then
            echo "::error::版本号不一致：Updater.swift 的 AppVersion.fallback ($SRC) 与发布版本 ($VER) 不同"
            exit 1
          fi
          if ! grep -q "^## \[$VER\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 [$VER] 小节"
            exit 1
          fi

      - name: Build (release, universal)
        run: |
          set -e
          # 单条命令同时构建 arm64 + x86_64 时，Swift 5.10 的 x86_64 前端会读到
          # arm64 架构的 swiftmodule（MacBatteryCore 作为 Swift 库 target 后暴露），
          # 触发 SIL 反序列化崩溃。改为分架构、各自独立 scratch 目录构建，再 lipo 合成。
          swift build -c release --arch arm64 --scratch-path .build-arm64
          swift build -c release --arch x86_64 --scratch-path .build-x86_64
          ARM_BIN="$(swift build -c release --arch arm64 --scratch-path .build-arm64 --show-bin-path)"
          X64_BIN="$(swift build -c release --arch x86_64 --scratch-path .build-x86_64 --show-bin-path)"
          mkdir -p dist
          lipo -create "$ARM_BIN/MacBattery" "$X64_BIN/MacBattery" -output dist/MacBattery
          lipo -create "$ARM_BIN/MacBatteryHelper" "$X64_BIN/MacBatteryHelper" -output dist/MacBatteryHelper
          lipo -info dist/MacBattery

          # 多语言资源 bundle（内含 *.lproj/Localizable.strings）与架构无关，取 arm64 那份。
          # 必须随 .app 一起分发：Bundle.module 找不到它时，界面文案会整体回退成键名。
          rm -rf dist/MacBattery_MacBatteryCore.bundle
          cp -R "$ARM_BIN/MacBattery_MacBatteryCore.bundle" dist/
          test -d dist/MacBattery_MacBatteryCore.bundle/zh-Hans.lproj || {
            echo "::error::资源 bundle 内缺少 zh-Hans.lproj（默认语言）"; exit 1;
          }
          test -d dist/MacBattery_MacBatteryCore.bundle/en.lproj || {
            echo "::error::资源 bundle 内缺少 en.lproj"; exit 1;
          }
        timeout-minutes: 30

      - name: Assemble .app bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          APP="dist/MacBattery.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # 构建步骤已把 universal 二进制放进 dist/。
          cp dist/MacBattery "$APP/Contents/MacOS/MacBattery"

          # 多语言资源放两处，任一处都能被 L10n 找到：
          # ① Contents/Resources/<lang>.lproj —— macOS 标准布局（CFBundleLocalizations 靠它生效）；
          # ② SwiftPM 资源 bundle —— swift run 与既有布局用。
          # v1.2.0 只放了 ②，而 L10n 当时第一个候选是 Bundle.module（找不到就 fatalError），
          # 结果启动即 SIGILL。现在 ① 是主路径，② 只作兼容。
          cp -R dist/MacBattery_MacBatteryCore.bundle "$APP/Contents/Resources/"
          for lproj in dist/MacBattery_MacBatteryCore.bundle/*.lproj; do
            cp -R "$lproj" "$APP/Contents/Resources/"
          done
          for lang in zh-Hans en; do
            test -d "$APP/Contents/Resources/$lang.lproj" || {
              echo "::error::应用包内缺少 $lang.lproj（界面文案会回退为键名）"; exit 1;
            }
          done
          echo "--- $APP/Contents/Resources ---"
          ls -1 "$APP/Contents/Resources"
          echo "--- resource bundle ---"
          ls -1 "$APP/Contents/Resources/MacBattery_MacBatteryCore.bundle" || true
          # dist 里的那份只为校验来源，删掉以免 DMG 里多出一个资源 bundle 目录。
          rm -rf dist/MacBattery_MacBatteryCore.bundle
          echo '' | base64 --decode > "$APP/Contents/Info.plist"

          # 拷贝应用图标到 bundle 并声明 CFBundleIconFile，否则 Finder/Dock 显示默认空白图标。
          if [ -f Resources/AppIcon.icns ]; then
            cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
            echo "copied Resources/AppIcon.icns"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile AppIcon" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" "$APP/Contents/Info.plist"

          # 门禁：图标必须真的进了 .app，且 Info.plist 指向它。
          # 原先这段是 `cp … || true` 式的尽力而为：图标一旦没进去，构建阶段毫无反应，
          # 只在用户装完之后表现为 Finder/Dock 里的默认空白图标 —— 属于"没人会立刻发现"的缺陷。
          # 换图标（Resources/AppIcon.*）时必须保留这条门禁。
          test -s "$APP/Contents/Resources/AppIcon.icns" || {
            echo "::error::.app 内缺少 AppIcon.icns（Finder/Dock 会显示默认空白图标）"; exit 1;
          }
          ICON_KEY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist" 2>/dev/null || true)"
          test "$ICON_KEY" = "AppIcon" || {
            echo "::error::Info.plist 的 CFBundleIconFile 是 '$ICON_KEY'，应为 AppIcon"; exit 1;
          }
          echo "OK: app icon installed ($ICON_KEY)"

          # 用解析出的版本号覆盖 Info.plist，保证应用内自动更新能正确比对版本。
          # 无条件覆盖：workflow_dispatch 时 GITHUB_REF_NAME 是分支名（没有 v 前缀），
          # 旧的条件判断会整段跳过，导致版本号停在 base64 Info.plist 里硬编码的 1.0.0。
          VER="$RELEASE_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$APP/Contents/Info.plist"
          echo "set bundle version to $VER"

          codesign --force --sign - "$APP" >/dev/null 2>&1 || true

          # 把 root helper 二进制与安装脚本一并放入 dist，随 DMG 分发
          # helper 二进制已由构建步骤合成到 dist/（universal）。
          cp dist/MacBatteryHelper dist/macbattery-helper
          cp Scripts/install_helper.sh dist/install_helper.sh 2>/dev/null || true

      - name: Smoke test (must survive launch)
        run: |
          set -e
          APP="dist/MacBattery.app"
          # 浮窗应用启动后会常驻，所以「8 秒后进程还在」就说明启动路径没崩。
          # 这条门禁是补 v1.2.0 的漏：资源加载失败会在 applicationDidFinishLaunching 里
          # 直接 SIGILL（Bundle.module 找不到 bundle 时 fatalError），而当时的 CI 只断言了
          # 「文件被拷进 .app」，没有验证「App 真的能起来」。
          "$APP/Contents/MacOS/MacBattery" > /tmp/macbattery-smoke.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::MacBattery 在启动 8 秒内退出或崩溃（见下方日志）"
            cat /tmp/macbattery-smoke.log || true
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          echo "OK: app still alive after 8s"

      - name: Create DMG
        run: |
          set -e
          rm -f MacBattery.dmg
          rm -rf dmg-root
          mkdir -p dmg-root
          # 平铺 dist/ 的内容作为 DMG 根目录。
          # 注意：这里**刻意不放** /Applications 的软链 —— `hdiutil create -srcfolder`
          # 是否原样保留源目录里的符号链接并无保证，万一它跟进了 /Applications，
          # 就会把整台 runner 的「应用程序」目录塞进镜像。软链改在已挂载的读写镜像里创建。
          cp -R dist/. dmg-root/
          test -d dmg-root/MacBattery.app || { echo "::error::dmg-root 内缺少 MacBattery.app"; exit 1; }

          RW_DMG="$RUNNER_TEMP/MacBattery.rw.dmg"
          MNT="$RUNNER_TEMP/dmg-mnt"
          rm -f "$RW_DMG"
          rm -rf "$MNT"
          mkdir -p "$MNT"

          # ① 先出可读写镜像；② 挂载后写入指向 /Applications 的快捷方式（即用户在
          # 访达里看到的「应用程序」文件夹图标）；③ 再转成压缩只读 DMG 分发。
          hdiutil create \
            -volname "MacBattery" \
            -srcfolder dmg-root \
            -fs HFS+ \
            -ov \
            -format UDRW \
            "$RW_DMG"
          hdiutil attach "$RW_DMG" -nobrowse -mountpoint "$MNT"
          ln -s /Applications "$MNT/Applications"
          ls -la "$MNT"
          hdiutil detach "$MNT"
          hdiutil convert "$RW_DMG" -format UDZO -ov -o MacBattery.dmg
          ls -lh MacBattery.dmg

      - name: Verify DMG (Applications shortcut + payload)
        run: |
          set -e
          MNT="$RUNNER_TEMP/dmg-verify"
          rm -rf "$MNT"
          mkdir -p "$MNT"
          hdiutil attach MacBattery.dmg -nobrowse -readonly -mountpoint "$MNT"
          # 校验结束务必卸载，否则后续步骤/清理可能因卷被占用而失败。
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT

          ls -la "$MNT"
          # 门禁 1：必须有指向 /Applications 的符号链接，用户才能把 .app 直接拖进「应用程序」。
          test -L "$MNT/Applications" || { echo "::error::DMG 内缺少 Applications 快捷方式"; exit 1; }
          LINK_TARGET="$(readlink "$MNT/Applications")"
          test "$LINK_TARGET" = "/Applications" || {
            echo "::error::Applications 快捷方式指向 $LINK_TARGET，应为 /Applications"; exit 1;
          }
          # 门禁 2：换了打包路径（srcfolder → 读写镜像转换），载荷落位不能被带偏。
          test -d "$MNT/MacBattery.app" || { echo "::error::DMG 内缺少 MacBattery.app"; exit 1; }
          test -f "$MNT/MacBattery.app/Contents/MacOS/MacBattery" || {
            echo "::error::DMG 内的 MacBattery.app 缺少可执行文件"; exit 1;
          }
          test -f "$MNT/macbattery-helper" || { echo "::error::DMG 内缺少 macbattery-helper"; exit 1; }
          echo "OK: DMG contains Applications -> /Applications"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            MacBattery.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "MacBattery $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload DMG (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MacBattery.dmg
          path: MacBattery.dmg