name: Build and release DMG

# Trigger on version tags (v*) and allow manual dispatch.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # Intel build runner -> x86_64 binary, matching Intel Macs.
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release --arch x86_64
        timeout-minutes: 30

      - name: Assemble .app bundle
        run: |
          set -e
          APP="dist/MacBattery.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/MacBattery "$APP/Contents/MacOS/MacBattery"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CFBundleExecutable</key><string>MacBattery</string>
	<key>CFBundleIdentifier</key><string>com.zioon.macbattery</string>
	<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
	<key>CFBundleName</key><string>MacBattery</string>
	<key>CFBundleDisplayName</key><string>MacBattery</string>
	<key>CFBundlePackageType</key><string>APPL</string>
	<key>CFBundleVersion</key><string>1.0</string>
	<key>CFBundleShortVersionString</key><string>1.0.0</string>
	<key>LSMinimumSystemVersion</key><string>12.0</string>
	<key>NSHighResolutionCapable</key><true/>
</dict>
</plist>
PLIST
          codesign --force --sign - "$APP" >/dev/null 2>&1 || true

      - name: Create DMG
        run: |
          rm -f MacBattery.dmg
          hdiutil create \
            -volname "MacBattery" \
            -srcfolder dist \
            -ov \
            -format UDZO \
            MacBattery.dmg

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            MacBattery.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "MacBattery $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload DMG (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MacBattery.dmg
          path: MacBattery.dmg